<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8" /><title>measure</title>
<style>
  body { margin: 0; padding: 12px; background: #d9dbe0; font: 12px/1.4 -apple-system, "Noto Sans KR", sans-serif; }
  #cap { color: #222; font-weight: 700; margin: 0 0 6px; }
  iframe { display: block; background: #fff; border: 0; }
</style></head>
<body>
  <p id="cap">…</p>
  <iframe id="mm" width="1280" height="800" src="about:blank"></iframe>
  <script>
    var q = new URLSearchParams(location.search);
    var w = parseInt(q.get('w') || '1280', 10);
    var h = parseInt(q.get('h') || '800', 10);
    var src = q.get('p') || './';
    var f = document.getElementById('mm');
    var cap = document.getElementById('cap');
    f.width = w; f.height = h;
    f.addEventListener('load', function () {
      var iw = f.contentWindow.innerWidth;
      var sw = f.contentDocument.documentElement.scrollWidth;
      cap.textContent = 'frame ' + w + '×' + h + ' · layout viewport ' + iw + 'px · 문서 scrollWidth ' + sw + 'px · ' + src;
    });
    f.src = src;
  </script>
</body></html>
