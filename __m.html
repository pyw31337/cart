<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8" /><title>measure</title>
<style>body{margin:0;padding:0;background:#d9dbe0}iframe{display:block;background:#fff;border:0}</style></head>
<body>
<iframe id="mm" width="320" height="568" src="about:blank"></iframe>
<script>
var q=new URLSearchParams(location.search);
var f=document.getElementById('mm');
f.width=parseInt(q.get('w')||'320',10); f.height=parseInt(q.get('h')||'568',10);
f.src=q.get('p')||'./';
</script>
</body></html>
