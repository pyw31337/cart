name: LetsCart → Limery feed

# 라임리 연동 피드(data/limery.json) — 카탈로그·트래커가 바뀌면, 그리고 매일 09:40 KST 에 다시 만든다.
on:
  push:
    branches: [main]
    paths: ['data/catalog.json', 'data.json', 'scripts/build_limery_feed.mjs']
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limery-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build feed
        run: node scripts/build_limery_feed.mjs
      - name: Commit feed
        run: |
          git config user.name 'letscart-limery-feed[bot]'
          git config user.email 'letscart-limery-feed[bot]@users.noreply.github.com'
          git add data/limery.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(feed): refresh Limery feed [skip ci]'
            git pull --rebase -X theirs || true
            git push
          fi
