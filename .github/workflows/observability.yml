name: LetsCart observability ledger

on:
  schedule:
    - cron: '40 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build ledger
        run: python3 scripts/record_observability.py
      - name: Commit ledger
        run: |
          git config user.name 'letscart-observability[bot]'
          git config user.email 'letscart-observability[bot]@users.noreply.github.com'
          git add -f data/observability/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ops): publish LetsCart observability ledger [skip ci]'
            git push
          fi
