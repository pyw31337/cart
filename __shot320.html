<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>__shot320</title>
<style>
  html,body{margin:0;background:#c9ccc3;font:11px/1.4 -apple-system,sans-serif;color:#111}
  .blk{background:#fff;margin:10px;width:320px}
  .lbl{padding:4px 6px;font-weight:700;background:#111315;color:#fff}
  .m{padding:3px 6px;font-weight:700}
  iframe{border:0;display:block;background:#fff;width:320px}
</style>
</head>
<body>
<div class="blk"><div class="lbl">320 · / 히어로</div><iframe id="a" data-h="1080"></iframe><div class="m" id="ma">–</div></div>
<div class="blk"><div class="lbl">320 · / 20품목</div><iframe id="b" data-h="1250" data-hash="rivals"></iframe><div class="m" id="mb">–</div></div>
<div class="blk"><div class="lbl">320 · / 3초 체험</div><iframe id="c" data-h="1250" data-hash="sample"></iframe><div class="m" id="mc">–</div></div>
<div class="blk"><div class="lbl">320 · / 카탈로그</div><iframe id="d" data-h="1100" data-hash="catalog"></iframe><div class="m" id="md">–</div></div>
<div class="blk"><div class="lbl">320 · /local/?demo=1</div><iframe id="e" data-h="1100" data-hash="view-shop"></iframe><div class="m" id="me">–</div></div>
<script>
  var cb = Date.now();
  [['a', 'ma'], ['b', 'mb'], ['c', 'mc'], ['d', 'md'], ['e', 'me']].forEach(function (pair) {
    var f = document.getElementById(pair[0]), o = document.getElementById(pair[1]);
    var base = pair[0] === 'e' ? 'local/?demo=1' : './';
    var hash = f.dataset.hash ? '#' + f.dataset.hash : '';
    f.height = +f.dataset.h;
    f.src = base + '?cb=' + cb + hash;
    f.addEventListener('load', function () {
      setTimeout(function () {
        try {
          var d = f.contentDocument, de = d && d.documentElement;
          if (!de) { o.textContent = '접근 불가'; return; }
          o.textContent = 'client ' + de.clientWidth + ' / scroll ' + de.scrollWidth +
            (de.scrollWidth > de.clientWidth ? '  ⚠ 넘침' : '  ✓ 넘침 0');
        } catch (err) { o.textContent = '측정 실패: ' + err.message; }
      }, 2200);
    });
  });
</script>
</body>
</html>
